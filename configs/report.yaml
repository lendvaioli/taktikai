# Report stage: metrics.json + events + clips -> report.json / report.md via an LLM agent.
backend: ollama                       # ollama (local, free) | anthropic (optional, paid)
backend_env: TAKTIKAI_LLM_BACKEND     # this environment variable overrides `backend`
prompt_path: prompts/report_system.md # versioned like code; its sha256 is logged with every run
max_steps: 8                          # LLM calls per run, the validator's retry included
retries: 1                            # a rejected report gets one corrected resubmission
number_tolerance: 0.5                 # a written number may differ from a tool value by half a
                                      # unit of its last digit (rounding); shares also as percent
max_events: 30                        # get_events returns at most this many events
semantics:                            # rule-based checks of the report text (report/semantics.py)
  greater_stems: [több, nagyobb, magasabb]      # "first number > second number"
  less_stems: [kevesebb, kisebb, alacsonyabb]   # "first number < second number"
  not_comparative: [többi, többség]   # words starting with a stem that are not comparisons
  negation: nem                       # "nem több" flips the direction
  swap_word: képest                   # "a 54-hez képest 51 kevesebb": the subject comes second
  clause_breaks: [de, bár, viszont, azonban, míg, ugyanakkor]  # ", bár ..." starts a new clause
  english_words: [the, and, of, with, pass, passes, ball, loss, losses, team, home, away, zone,
                  third, final, pressing, shot, shots, rate, completion, share, total, very, low,
                  high, left, right, centre, center, sample]   # never: a, is, ok, per, bal, el, be
ollama:
  host: http://127.0.0.1:11434        # local server only
  model: hf.co/Qwen/Qwen3-8B-GGUF:Q4_K_M   # Apache-2.0, pulled from the Hugging Face Hub
  think: false                        # Qwen3 non-thinking mode
  timeout_sec: 900
  options:                            # model card's non-thinking settings, plus a fixed seed
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    presence_penalty: 1.5
    seed: 0
    num_ctx: 16384                    # Ollama's default context is too small for tool results
anthropic:
  model: claude-haiku-5-5             # fast, low-cost; $0.10 / $0.50 per MTok in/out up to 100K
                                      # prompt tokens (Claude API reference, cached 2026-10-06)
  max_tokens: 16000                   # thinking (on by default) counts towards this cap
  effort: medium                      # the model's default; lower to "low" to save tokens
  server_fallback: false              # Haiku 5.5 has no server-side refusal fallback; true only
                                      # for models that support it (e.g. claude-opus-5-5)
