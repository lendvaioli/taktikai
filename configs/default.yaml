# Default pipeline configuration. One section per stage; values are added
# together with the stage implementation. Stage-specific files live next to this one.

paths:
  raw_dir: data/raw                 # source videos and downloaded reference data, never committed
  processed_dir: data/processed
  models_dir: models                # downloaded weights, never committed

# video:      see configs/video.yaml
# detection:  see configs/detection.yaml
# tracking:   see configs/tracking.yaml

# pitch:
#   pitch dimensions and calibration parameters

# events:
#   event detection thresholds

# clips:
#   clip padding and encoding parameters

# metrics:
#   metric definitions and parameters

# report:
#   report template and prompt version

# evals:
#   golden set location and matching tolerances
