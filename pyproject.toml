[project]
name = "match-tagger"
version = "0.1.0"
description = "AI pipeline that turns a football club's match footage into tagged events, clips and a coaching report."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
apps = [
    "streamlit>=1.40",
]
ml = [
    "gdown>=5.2",
    "mplsoccer>=1.8",
    "scikit-learn>=1.5",
    "supervision>=0.25,<0.31",  # sv.ByteTrack removed in 0.31.0
    "torch>=2.4",
    "transformers>=4.45",
    "ultralytics>=8.3",
    "umap-learn>=0.5.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/match_tagger"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D", "ANN", "PLR0915"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
