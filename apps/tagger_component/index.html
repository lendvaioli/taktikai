<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<!-- Video tagger component for apps/tagger.py. Plain JS implementation of the Streamlit
     component protocol (componentReady / render / setComponentValue / setFrameHeight). -->
<style>
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; color: #1f2328; }
  video { width: 100%; max-height: 62vh; background: #000; display: block; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }
  button { font-size: 14px; padding: 6px 12px; border: 1px solid #c8ccd0; border-radius: 6px;
           background: #f6f8fa; cursor: pointer; }
  button:hover { background: #eaeef2; }
  button.type { font-weight: 600; min-width: 130px; }
  button.team.active { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  .muted { color: #656d76; }
  #toast { min-height: 20px; font-weight: 600; color: #1a7f37; }
  table { border-collapse: collapse; width: 100%; margin-top: 4px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #eaeef2; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #f6f8fa; }
  tbody tr.near { background: #fff8c5; }
  td.del { text-align: right; }
  td.del button { padding: 2px 8px; font-size: 12px; }
</style>
</head>
<body>
<video id="video" controls preload="auto" tabindex="-1"></video>

<div class="row">
  <span class="muted">Csapat:</span>
  <button class="team" data-team="home">Hazai (H)</button>
  <button class="team" data-team="away">Vendég (V)</button>
  <span id="kit" class="muted"></span>
</div>
<div class="row">
  <button class="type" data-type="pass">1 · Passz</button>
  <button class="type" data-type="ball_loss">2 · Labdavesztés</button>
  <button class="type" data-type="shot">3 · Lövés</button>
  <button class="type" data-type="set_piece">4 · Pontrúgás</button>
  <button id="undo">Visszavonás (Z)</button>
</div>
<div class="row">
  <span id="clock" class="muted"></span>
  <span id="speed" class="muted"></span>
  <span id="toast"></span>
</div>
<div class="muted">
  Billentyűk: 1–4 esemény · H / V csapat · Z visszavonás · Szóköz lejátszás/szünet ·
  ← / → ±0,2 s · , / . ±1 képkocka · [ / ] lassítás / gyorsítás. Kattints a videó alatti
  területre, hogy a billentyűk működjenek.
</div>

<table>
  <thead><tr><th>Idő</th><th>Esemény</th><th>Csapat</th><th></th></tr></thead>
  <tbody id="events"></tbody>
</table>

<script>
const TYPES = { pass: "Passz", ball_loss: "Labdavesztés", shot: "Lövés", set_piece: "Pontrúgás" };
const TYPE_KEYS = { "1": "pass", "2": "ball_loss", "3": "shot", "4": "set_piece" };
const TEAMS = { home: "Hazai", away: "Vendég" };
const SPEEDS = [0.25, 0.5, 1, 1.5, 2];

const video = document.getElementById("video");
let team = "home", fps = 25, kits = {}, events = [], currentSrc = null;

function post(type, extra) {
  window.parent.postMessage({ isStreamlitMessage: true, type, ...extra }, "*");
}
function send(msg) {
  msg.nonce = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
  post("streamlit:setComponentValue", { value: msg, dataType: "json" });
}
function setHeight() { post("streamlit:setFrameHeight", { height: document.body.scrollHeight + 8 }); }
function fmtTime(t) {
  const m = Math.floor(t / 60), s = (t - 60 * m).toFixed(1).padStart(4, "0");
  return `${m}:${s}`;
}
function toast(text) {
  const el = document.getElementById("toast");
  el.textContent = text;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (el.textContent = ""), 1500);
}

function tag(type) {
  const t = video.currentTime;
  send({ action: "add", type, team, t_sec: t });
  toast(`${TYPES[type]} · ${TEAMS[team]} · ${fmtTime(t)}`);
}
function undo() { send({ action: "undo" }); toast("Visszavonva"); }
function setTeam(value) {
  team = value;
  document.querySelectorAll("button.team").forEach(b =>
    b.classList.toggle("active", b.dataset.team === team));
  document.getElementById("kit").textContent = kits[team] ? `(${kits[team]})` : "";
}
function seek(t) { video.pause(); video.currentTime = Math.max(0, t); }
function step(dt) { seek(video.currentTime + dt); }
function changeSpeed(dir) {
  const i = SPEEDS.indexOf(video.playbackRate);
  video.playbackRate = SPEEDS[Math.min(SPEEDS.length - 1, Math.max(0, (i < 0 ? 2 : i) + dir))];
  showClock();
}
function showClock() {
  document.getElementById("clock").textContent = `Idő: ${fmtTime(video.currentTime)}`;
  document.getElementById("speed").textContent = `Sebesség: ${video.playbackRate}×`;
  document.querySelectorAll("#events tr").forEach(tr =>
    tr.classList.toggle("near", Math.abs(Number(tr.dataset.t) - video.currentTime) < 0.5));
}

function renderEvents() {
  const body = document.getElementById("events");
  body.innerHTML = "";
  for (const e of events) {
    const tr = document.createElement("tr");
    tr.dataset.t = e.t_sec;
    tr.innerHTML = `<td>${fmtTime(e.t_sec)}</td><td>${TYPES[e.type]}</td>` +
      `<td>${TEAMS[e.team]}</td><td class="del"><button>Törlés</button></td>`;
    tr.addEventListener("click", () => seek(e.t_sec));
    tr.querySelector("button").addEventListener("click", ev => {
      ev.stopPropagation();
      send({ action: "delete", id: e.id });
      toast("Törölve");
    });
    body.appendChild(tr);
  }
  showClock();
}

document.querySelectorAll("button.type").forEach(b =>
  b.addEventListener("click", () => tag(b.dataset.type)));
document.querySelectorAll("button.team").forEach(b =>
  b.addEventListener("click", () => setTeam(b.dataset.team)));
document.getElementById("undo").addEventListener("click", undo);
video.addEventListener("timeupdate", showClock);
video.addEventListener("seeked", showClock);
video.addEventListener("loadedmetadata", setHeight);

document.addEventListener("keydown", ev => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const key = ev.key.toLowerCase();
  const handlers = {
    h: () => setTeam("home"), v: () => setTeam("away"), z: undo,
    " ": () => (video.paused ? video.play() : video.pause()),
    arrowleft: () => step(-0.2), arrowright: () => step(0.2),
    ",": () => step(-1 / fps), ".": () => step(1 / fps),
    "[": () => changeSpeed(-1), "]": () => changeSpeed(1),
  };
  if (TYPE_KEYS[key]) {
    if (!ev.repeat) tag(TYPE_KEYS[key]);
  } else if (handlers[key]) {
    if (ev.repeat && !["arrowleft", "arrowright", ",", "."].includes(key)) return;
    handlers[key]();
  } else {
    return;
  }
  ev.preventDefault();
  ev.stopPropagation();
}, true);

window.addEventListener("message", ev => {
  if (!ev.data || ev.data.type !== "streamlit:render") return;
  const args = ev.data.args;
  if (args.video_url !== currentSrc) {
    currentSrc = args.video_url;
    video.src = args.video_url;
  }
  fps = args.fps || 25;
  kits = args.kits || {};
  events = args.events || [];
  setTeam(team);
  renderEvents();
  setHeight();
});

post("streamlit:componentReady", { apiVersion: 1 });
setTeam(team);
setHeight();
</script>
</body>
</html>
