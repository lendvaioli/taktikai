<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<!-- Shared video + event-list component of apps/tagger.py (mode "tag") and apps/review.py
     (mode "review"). Plain JS implementation of the Streamlit component protocol. The video is
     streamed from the local media server (HTTP range requests), never embedded in the page. -->
<style>
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; color: #1f2328; }
  video { width: 100%; max-height: 58vh; background: #000; display: block; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }
  button { font-size: 14px; padding: 5px 11px; border: 1px solid #c8ccd0; border-radius: 6px;
           background: #f6f8fa; cursor: pointer; }
  button:hover:not(:disabled) { background: #eaeef2; }
  button:disabled { opacity: 0.45; cursor: default; }
  button.type { font-weight: 600; min-width: 120px; }
  button.on { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  .muted { color: #656d76; }
  #toast { min-height: 20px; font-weight: 600; color: #1a7f37; }
  #list { max-height: 34vh; overflow-y: auto; border-top: 1px solid #eaeef2; }
  table { border-collapse: collapse; width: 100%; }
  th { position: sticky; top: 0; background: #fff; text-align: left; padding: 4px 6px; }
  td { padding: 3px 6px; border-bottom: 1px solid #eaeef2; white-space: nowrap; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #f6f8fa; }
  tbody tr.sel { background: #ddf4ff; }
  tbody tr.near td:first-child { font-weight: 700; }
  tbody tr.golden { color: #8250df; }
  td button { padding: 1px 7px; font-size: 12px; min-width: 0; }
  .badge { display: inline-block; padding: 0 6px; border-radius: 10px; font-size: 12px;
           font-weight: 600; }
  .TP { background: #dafbe1; color: #1a7f37; } .FP { background: #ffebe9; color: #cf222e; }
  .FN { background: #fbefff; color: #8250df; }
  .st-unreviewed { color: #656d76; } .st-accepted { color: #1a7f37; }
  .st-corrected, .st-added { color: #9a6700; }
</style>
</head>
<body>
<video id="video" controls preload="metadata" tabindex="-1"></video>

<div class="row">
  <span class="muted">Csapat:</span>
  <button class="team-pick" data-team="home">Hazai (H)</button>
  <button class="team-pick" data-team="away">Vendég (V)</button>
  <span id="kit" class="muted"></span>
</div>
<div class="row" id="type-buttons"></div>
<div class="row">
  <span id="clock" class="muted"></span><span id="speed" class="muted"></span>
  <span id="toast"></span>
</div>
<div class="muted" id="help"></div>
<div id="list"><table><thead id="head"></thead><tbody id="events"></tbody></table></div>

<script>
const TYPES = { pass: "Passz", ball_loss: "Labdavesztés", shot: "Lövés", set_piece: "Pontrúgás" };
const TEAMS = { home: "Hazai", away: "Vendég" };
const STATUS = { unreviewed: "új", accepted: "elfogadva", corrected: "javítva", added: "hozzáadva" };
const EVAL_TITLE = { TP: "helyes", FP: "téves", FN: "hiányzó (csak a golden listában)" };
const SPEEDS = [0.25, 0.5, 1, 1.5, 2];

const video = document.getElementById("video");
let args = { mode: "tag", types: [], events: [], kits: {}, fps: 25, window: null };
let team = "home", currentSrc = null, selected = null, stopAt = null;

const post = (type, extra) =>
  window.parent.postMessage({ isStreamlitMessage: true, type, ...extra }, "*");
function send(msg) {
  msg.nonce = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
  post("streamlit:setComponentValue", { value: msg, dataType: "json" });
}
const setHeight = () => post("streamlit:setFrameHeight", { height: document.body.scrollHeight + 8 });
const review = () => args.mode === "review";
function fmtTime(t) {
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60);
  const s = (t % 60).toFixed(1).padStart(4, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${s}` : `${m}:${s}`;
}
function toast(text) {
  const el = document.getElementById("toast");
  el.textContent = text;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (el.textContent = ""), 1500);
}

function addEvent(type) {
  const t = video.currentTime;
  send({ action: "add", type, team, t_sec: t });
  toast(`${TYPES[type]} · ${TEAMS[team]} · ${fmtTime(t)} hozzáadva`);
}
function act(action, ev, extra = {}) {
  send({ action, id: ev.id, ...extra });
  toast({ accept: "Elfogadva", delete: "Törölve", change_type: "Típus módosítva",
          change_team: "Csapat módosítva" }[action]);
}
function setTeam(value) {
  team = value;
  document.querySelectorAll("button.team-pick").forEach(b =>
    b.classList.toggle("on", b.dataset.team === team));
  document.getElementById("kit").textContent = args.kits[team] ? `(${args.kits[team]})` : "";
}
function play(ev) {
  selected = ev.id;
  if (review() && args.window) {
    video.currentTime = Math.max(0, ev.t_sec - args.window.pre);
    stopAt = ev.t_sec + args.window.post;
    video.play();
  } else {
    video.pause();
    video.currentTime = ev.t_sec;
  }
  markRows();
}
function step(dt) { video.pause(); stopAt = null; video.currentTime = Math.max(0, video.currentTime + dt); }
function changeSpeed(dir) {
  const i = SPEEDS.indexOf(video.playbackRate);
  video.playbackRate = SPEEDS[Math.min(SPEEDS.length - 1, Math.max(0, (i < 0 ? 2 : i) + dir))];
  showClock();
}
function moveSelection(dir) {
  const ids = args.events.map(e => e.id);
  const i = ids.indexOf(selected);
  const next = args.events[Math.min(ids.length - 1, Math.max(0, i < 0 ? 0 : i + dir))];
  if (next) play(next);
}
const selectedEvent = () => args.events.find(e => e.id === selected && e.source !== "golden");

function chips(ev, field, options, action) {
  return Object.keys(options).map(key => {
    const b = document.createElement("button");
    b.textContent = options[key];
    b.classList.toggle("on", ev[field] === key);
    b.disabled = ev.source === "golden" || ev[field] === key;
    b.addEventListener("click", e => { e.stopPropagation(); act(action, ev, { [field]: key }); });
    return b;
  });
}
function cell(tr, content) {
  const td = document.createElement("td");
  (Array.isArray(content) ? content : [content]).forEach(c =>
    typeof c === "string" ? td.insertAdjacentHTML("beforeend", c) : td.appendChild(c));
  tr.appendChild(td);
}
function button(label, title, onClick, disabled = false) {
  const b = document.createElement("button");
  b.textContent = label; b.title = title; b.disabled = disabled;
  b.addEventListener("click", e => { e.stopPropagation(); onClick(); });
  return b;
}
function renderHead() {
  const cols = review() ? ["Idő", "Típus", "Csapat", "Zóna", "Állapot", "", ""]
                        : ["Idő", "Esemény", "Csapat", ""];
  document.getElementById("head").innerHTML = `<tr>${cols.map(c => `<th>${c}</th>`).join("")}</tr>`;
}
function renderRow(ev) {
  const tr = document.createElement("tr");
  tr.dataset.id = ev.id; tr.dataset.t = ev.t_sec;
  if (ev.source === "golden") tr.classList.add("golden");
  tr.addEventListener("click", () => play(ev));
  cell(tr, fmtTime(ev.t_sec));
  if (!review()) {
    cell(tr, TYPES[ev.type]); cell(tr, TEAMS[ev.team]);
    cell(tr, button("Törlés", "Esemény törlése", () => act("delete", ev)));
    return tr;
  }
  const types = Object.fromEntries(args.types.map(t => [t, TYPES[t]]));
  cell(tr, chips(ev, "type", types, "change_type"));
  cell(tr, chips(ev, "team", TEAMS, "change_team"));
  cell(tr, ev.zone ? String(ev.zone) : "–");
  const badge = ev.eval ? `<span class="badge ${ev.eval}" title="${EVAL_TITLE[ev.eval]}">${ev.eval}</span> ` : "";
  const status = ev.status ? `<span class="st-${ev.status}">${STATUS[ev.status]}</span>` : "";
  cell(tr, badge + status);
  const golden = ev.source === "golden";
  cell(tr, button("✓", "Elfogad (A)", () => act("accept", ev), golden || ev.status !== "unreviewed"));
  cell(tr, button("✗", "Töröl (D)", () => act("delete", ev), golden));
  return tr;
}
function markRows() {
  document.querySelectorAll("#events tr").forEach(tr => {
    tr.classList.toggle("sel", tr.dataset.id === selected);
    tr.classList.toggle("near", Math.abs(Number(tr.dataset.t) - video.currentTime) < 0.5);
  });
}
function renderEvents() {
  renderHead();
  const body = document.getElementById("events");
  body.replaceChildren(...args.events.map(renderRow));
  markRows();
}
function renderTypeButtons() {
  const box = document.getElementById("type-buttons");
  box.replaceChildren(...args.types.map((t, i) =>
    Object.assign(button(`${i + 1} · ${TYPES[t]}`, "Esemény hozzáadása a jelenlegi időpontban",
                         () => addEvent(t)), { className: "type" })));
  box.appendChild(button("Visszavonás (Z)", "Utolsó művelet visszavonása", () => send({ action: "undo" })));
  document.getElementById("help").textContent = review()
    ? "Billentyűk: sorra kattintva lejátszás (−5 s … +3 s) · A elfogad · D töröl · N / P következő / előző · " +
      "1–2 hiányzó esemény hozzáadása · H / V csapat · Z visszavonás · Szóköz · ← / → ±0,2 s · [ / ] sebesség"
    : "Billentyűk: 1–4 esemény · H / V csapat · Z visszavonás · Szóköz lejátszás/szünet · " +
      "← / → ±0,2 s · , / . ±1 képkocka · [ / ] lassítás / gyorsítás";
}
function showClock() {
  document.getElementById("clock").textContent = `Idő: ${fmtTime(video.currentTime)}`;
  document.getElementById("speed").textContent = `Sebesség: ${video.playbackRate}×`;
  markRows();
}

document.querySelectorAll("button.team-pick").forEach(b =>
  b.addEventListener("click", () => setTeam(b.dataset.team)));
video.addEventListener("timeupdate", () => {
  if (stopAt !== null && video.currentTime >= stopAt) { video.pause(); stopAt = null; }
  showClock();
});
video.addEventListener("seeked", showClock);
video.addEventListener("loadedmetadata", setHeight);

document.addEventListener("keydown", ev => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const key = ev.key.toLowerCase();
  const typeIndex = Number(key) - 1;
  const sel = selectedEvent();
  const handlers = {
    h: () => setTeam("home"), v: () => setTeam("away"), z: () => send({ action: "undo" }),
    " ": () => (video.paused ? video.play() : video.pause()),
    arrowleft: () => step(-0.2), arrowright: () => step(0.2),
    ",": () => step(-1 / args.fps), ".": () => step(1 / args.fps),
    "[": () => changeSpeed(-1), "]": () => changeSpeed(1),
    ...(review() ? {
      a: () => sel && sel.status === "unreviewed" && act("accept", sel),
      d: () => sel && act("delete", sel),
      n: () => moveSelection(1), p: () => moveSelection(-1),
    } : {}),
  };
  if (typeIndex >= 0 && typeIndex < args.types.length) {
    if (!ev.repeat) addEvent(args.types[typeIndex]);
  } else if (handlers[key]) {
    if (ev.repeat && !["arrowleft", "arrowright", ",", "."].includes(key)) return;
    handlers[key]();
  } else {
    return;
  }
  ev.preventDefault();
  ev.stopPropagation();
}, true);

window.addEventListener("message", ev => {
  if (!ev.data || ev.data.type !== "streamlit:render") return;
  args = { ...args, ...ev.data.args };
  if (args.video_url !== currentSrc) { currentSrc = args.video_url; video.src = args.video_url; }
  setTeam(team);
  renderTypeButtons();
  renderEvents();
  setHeight();
});

post("streamlit:componentReady", { apiVersion: 1 });
setTeam(team);
setHeight();
</script>
</body>
</html>
